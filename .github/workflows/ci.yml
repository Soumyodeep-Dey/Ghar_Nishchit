name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-access-secret-not-used-outside-tests
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-used-outside-tests
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend/UI
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/UI/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high

  containers:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag ghar-nishchit-api:ci ./backend
      - run: docker build --tag ghar-nishchit-web:ci --file frontend/UI/Dockerfile .
